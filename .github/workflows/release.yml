# Build & publish builder images + docs site on release tags (v*).
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: latex-builder
            context: infra/docker/latex
          - image: web-builder
            context: infra/docker/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install --no-cache-dir "mkdocs-material>=9.5,<10"

      - name: Build docs site
        run: mkdocs build --strict --site-dir site

      - name: Package docs for release
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar -C site -czf "dist/docs-${version}.tar.gz" .
          (cd docs && zip -r "../dist/docs-${version}.zip" .)

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Attach docs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          if ! gh release view "${version}" >/dev/null 2>&1; then
            gh release create "${version}" \
              --title "${version}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "${version}" dist/* --clobber

  release-summary:
    name: Release summary
    needs: [docker, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Print published artifacts
        run: |
          owner_repo="${{ github.repository }}"
          version="${{ github.ref_name }}"
          cat <<EOF
          Published from ${version}:

          Docker (GHCR):
            ghcr.io/${owner_repo}/latex-builder:${version#v}
            ghcr.io/${owner_repo}/latex-builder:latest
            ghcr.io/${owner_repo}/web-builder:${version#v}
            ghcr.io/${owner_repo}/web-builder:latest

          Docs:
            GitHub Pages (environment github-pages)
            Release assets: docs-${version}.tar.gz / docs-${version}.zip
          EOF
