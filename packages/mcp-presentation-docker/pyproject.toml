[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "mcp-presentation-docker"
version = "0.1.0"
description = "ContainerRuntime port + bollard adapter (Docker Engine API, no CLI)"
requires-python = ">=3.14"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "mcp_docker._native"
