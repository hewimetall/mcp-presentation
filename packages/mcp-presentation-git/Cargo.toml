[package]
name = "mcp-presentation-git"
version = "0.1.0"
edition = "2021"
description = "GitPort (hexagonal) with GixGitAdapter — no git CLI, no push"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
gix = { version = "0.73", default-features = false, features = [
    "max-performance-safe",
] }
gix-date = "0.10"
thiserror = "2"
