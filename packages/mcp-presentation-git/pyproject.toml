[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "mcp-presentation-git"
version = "0.1.0"
description = "GitPort + gix adapter (bare, worktree, commit; no CLI, no push)"
requires-python = ">=3.14"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "mcp_git._native"
