[package]
name = "mcp-state"
version = "0.1.0"
edition = "2021"
description = "Sessions and workspaces store via PyO3 + rusqlite"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
