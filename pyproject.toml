[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "mcp-presentation-core"
version = "0.1.0"
description = "MCP server for presentation builds (PDF/web) with Rust task store"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "fastmcp[tasks]>=3.4.4",
    "pydantic>=2.12",
    "mcp-presentation-state",
    "mcp-presentation-git",
    "mcp-presentation-docker",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.16",
    "maturin>=1.8,<2",
]

[project.scripts]
mcp-presentation = "mcp_presentation.server:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "mcp_presentation._tasks"

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    ".",
    "packages/mcp-presentation-state",
    "packages/mcp-presentation-git",
    "packages/mcp-presentation-docker",
]

[tool.uv.sources]
mcp-presentation-state = { workspace = true }
mcp-presentation-git = { workspace = true }
mcp-presentation-docker = { workspace = true }

# --- Ruff ---
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["python", "tests", "packages"]
extend-exclude = ["target", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_presentation", "mcp_state", "mcp_git", "mcp_docker"]

[tool.ruff.format]
quote-style = "double"

# --- Mypy ---
[tool.mypy]
python_version = "3.14"
mypy_path = "python:packages/mcp-presentation-state/python:packages/mcp-presentation-git/python:packages/mcp-presentation-docker/python"
packages = ["mcp_presentation", "mcp_state", "mcp_git", "mcp_docker"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true

[[tool.mypy.overrides]]
module = [
    "mcp_presentation._tasks",
    "mcp_state._native",
    "mcp_git._native",
    "mcp_docker._native",
]
ignore_missing_imports = true
disallow_any_generics = false

# Pydantic BaseModel annotations trip disallow_any_explicit without the plugin.
[[tool.mypy.overrides]]
module = ["mcp_presentation.ir_models"]
disallow_any_explicit = false
disallow_any_generics = false

[tool.pytest.ini_options]
markers = [
    "docker: tests that need a Docker daemon and builder images",
]
